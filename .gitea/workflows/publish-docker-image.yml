name: Build and publish Docker image

on:
  push:

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install

      - name: Cache webpack
        uses: actions/cache@v4
        with:
          path: .cache/webpack/frontend
          key: ${{ runner.os }}-webpack-${{ hashFiles('yarn.lock', 'package.json', 'webpack.config.js') }}
          restore-keys: |
            ${{ runner.os }}-webpack-

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages
        run: npx update-browserslist-db@latest && yarn install --immutable
        env:
          CI: true

      - name: Build frontend
        run: npx webpack build --mode=development
        env:
          CI: true
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: build

  publish_latest:
    name: Publish latest image
    needs: build
    if: gitea.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ gitea.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --target=runtime \
            --platform linux/arm64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,mode=max,dest=/tmp/.buildx-cache \
            -t ${{ secrets.REGISTRY_HOST }}/${{ github.repository }}:latest \
            --push \
            .

  publish_tag:
    name: Publish tagged image
    needs: build
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mock Docker layer cache
        run: mkdir -p /tmp/.buildx-cache

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Publish tagged image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache
          tags: ${{ env.REGISTRY_HOST }}/${{ gitea.repository }}:movies-app-${{ gitea.ref_name }}
