name: Build and publish Docker image

on:
  push:

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install

      - name: Cache webpack
        uses: actions/cache@v5
        with:
          path: .cache/webpack/frontend
          key: ${{ runner.os }}-webpack-${{ hashFiles('yarn.lock', 'package.json', 'webpack.config.js') }}
          restore-keys: |
            ${{ runner.os }}-webpack-

      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages
        run: npx update-browserslist-db@latest && yarn install --immutable
        env:
          CI: true

      - name: Build frontend
        run: npx webpack build --mode=development
        env:
          CI: true
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build

  publish_latest:
    name: Publish latest image
    needs: build
    if: gitea.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ gitea.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=gitea_internal
          config-inline: |
            [registry."${{ secrets.REGISTRY_HOST }}"]
              http = true
              insecure = true

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Fix Docker credentials registry
        run: |
          sed -i "s#${{ secrets.HOST }}#${{ secrets.REGISTRY_HOST }}#g" \
            "${DOCKER_CONFIG:-$HOME/.docker}/config.json"

      - name: Publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache
          tags: ${{ secrets.REGISTRY_HOST }}/${{ gitea.repository }}:latest

  publish_tag:
    name: Publish tagged image
    needs: build
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ gitea.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=gitea_internal
          config-inline: |
            [registry."${{ secrets.REGISTRY_HOST }}"]
              http = true
              insecure = true

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Fix Docker credentials registry
        run: |
          sed -i "s#${{ secrets.HOST }}#${{ secrets.REGISTRY_HOST }}#g" \
            "${DOCKER_CONFIG:-$HOME/.docker}/config.json"

      - name: Publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache
          tags: ${{ secrets.REGISTRY_HOST }}/${{ gitea.repository }}:${{ gitea.ref_name }}
