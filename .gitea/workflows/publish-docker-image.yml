name: Build and publish Docker image

on:
  push:

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend
        run:  mkdir -p build && touch build/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: build

  publish_latest:
    name: Publish latest image
    needs: build
    if: gitea.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Setup QEMU
        run: |
          docker run --privileged --rm \
          tonistiigi/binfmt --install arm64

      - name: Mock Docker layer cache
        run: mkdir -p /tmp/.buildx-cache

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,mode=max,dest=/tmp/.buildx-cache \
            -t ${{ secrets.GITHUB_SERVER_URL }}/${{ gitea.repository }}:movies-app-latest \
            --push \
            .

  publish_tag:
    name: Publish tagged image
    needs: build
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mock Docker layer cache
        run: mkdir -p /tmp/.buildx-cache

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ gitea.GITHUB_SERVER_URL }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Publish tagged image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache
          tags: ${{ secrets.GITHUB_SERVER_URL }}/${{ gitea.repository }}:movies-app-${{ gitea.ref_name }}
