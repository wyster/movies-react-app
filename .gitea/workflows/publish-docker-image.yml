name: Build and publish Docker image

on:
  push:

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install

      - name: Cache webpack
        uses: actions/cache@v4
        with:
          path: .cache/webpack/frontend
          key: ${{ runner.os }}-webpack-${{ hashFiles('yarn.lock', 'package.json', 'webpack.config.js') }}
          restore-keys: |
            ${{ runner.os }}-webpack-

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages
        run: npx update-browserslist-db@latest && yarn install --immutable
        env:
          CI: true

      - name: Build frontend
        run: yarn build
        env:
          CI: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: build

  publish_latest:
    name: Publish latest image
    needs: build
    if: gitea.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io

      - name: Verify Docker
        run: docker info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ gitea.GITHUB_SERVER_URL }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Publish latest image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.GITHUB_SERVER_URL }}/${{ gitea.repository }}:movies-app-latest

  publish_tag:
    name: Publish tagged image
    needs: build
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io

      - name: Verify Docker
        run: docker info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ gitea.GITHUB_SERVER_URL }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Publish tagged image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.GITHUB_SERVER_URL }}/${{ gitea.repository }}:movies-app-${{ gitea.ref_name }}
