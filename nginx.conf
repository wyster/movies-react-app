server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep this endpoint as a real file lookup
    location = /env-config.js {
        try_files $uri =404;
    }

    # React Router routes must fall back to the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
